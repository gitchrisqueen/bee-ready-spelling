name: denylist-guard

# Hashes every candidate token in the working tree and the full history
# (`git log --all -p`, messages, authors, paths, refs) and compares against
# denylist.sha256. The log shows a per-hash zero/non-zero table and never the
# matched text, so this run's output is safe to cite publicly.
#
# Denylist guard, vendored from the maintainer's templates. The guard lives in
# scripts/denylist_guard.py and the hash list in denylist.sha256 at the repo
# root. The hash list is generated outside CI and only ever holds digests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch every ref
        run: git fetch --all --tags --prune --force
      - name: Denylist guard (tree + full history)
        run: python scripts/denylist_guard.py --denylist denylist.sha256 --root .
