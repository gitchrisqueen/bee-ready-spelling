name: Generate voice clips

# Keeps the pre-recorded clips (every word, its practice sentence, and the voice sample) in sync with
# words.json and sentences.js. Only new or changed clips are generated (tools/clips/generate.mjs), so a
# normal run takes minutes. Each voice is recorded in its own parallel job. When clips change they are
# committed to main and the site is redeployed.
#
# Privilege split on purpose. `generate` legs run npm and third-party code with a READ-ONLY token and no
# stored credentials. `commit` holds the write token, runs no npm or node code, and only accepts a
# strictly validated set of files from the artifacts.
#
# Manual run options (Actions tab > Generate voice clips > Run workflow):
#   voice        only this Kokoro voice id, e.g. af_heart
#   limit        stop after this many new clips per voice (smoke test, or split a big job)
#   redo         comma-separated clip keys to record again, e.g. blase,sentence_1abc
#   force_prune  allow deleting more than 5% of a voice's clips

on:
  push:
    branches: [main]
    paths:
      - words.json
      - sentences.js
      - voice-service.js
      - tools/clips/**
  workflow_dispatch:
    inputs:
      voice:
        description: Only this voice id (blank = all voices)
        required: false
        default: ''
      limit:
        description: Max new clips per voice this run (blank = no limit)
        required: false
        default: ''
      redo:
        description: Clip keys to record again, comma-separated (blank = none)
        required: false
        default: ''
      force_prune:
        description: Allow deleting more than 5% of a voice's clips
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: generate-clips
  cancel-in-progress: false

jobs:
  plan:
    # A manual run from any other branch must never reach main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      voices: ${{ steps.voices.outputs.voices }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: List the voices from voice-service.js
        id: voices
        env:
          IN_VOICE: ${{ inputs.voice }}
        run: |
          python3 -I - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          voices = sorted(set(re.findall(r"kokoro:'([a-z_]+)'", open("voice-service.js", encoding="utf8").read())))
          only = os.environ.get("IN_VOICE", "")
          if only:
              voices = [v for v in voices if v == only]
          if not voices:
              raise SystemExit("no matching voice")
          print("voices=" + json.dumps(voices))
          PY

  generate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        voice: ${{ fromJSON(needs.plan.outputs.voices) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check words.json and the code before recording anything
        run: npm test
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install generator (no install scripts)
        working-directory: tools/clips
        run: npm ci --ignore-scripts
      - name: Generate missing or changed clips
        id: gen
        working-directory: tools/clips
        # Stop well before the job limit so the steps below can still save finished clips.
        timeout-minutes: 300
        continue-on-error: true
        env:
          VOICE: ${{ matrix.voice }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_REDO: ${{ inputs.redo }}
          IN_FORCE: ${{ inputs.force_prune }}
        run: |
          [[ "$VOICE" =~ ^[a-z_]+$ ]] || { echo "bad voice id"; exit 1; }
          args=(--prune --voice "$VOICE")
          if [ -n "$IN_LIMIT" ]; then
            [[ "$IN_LIMIT" =~ ^[0-9]+$ ]] || { echo "limit must be a whole number"; exit 1; }
            args+=(--limit "$IN_LIMIT")
          fi
          if [ -n "$IN_REDO" ]; then
            [[ "$IN_REDO" =~ ^[a-z0-9][a-z0-9_-]*(,[a-z0-9][a-z0-9_-]*)*$ ]] || { echo "redo must be comma-separated clip keys"; exit 1; }
            args+=(--redo "$IN_REDO")
          fi
          if [ "$IN_FORCE" = "true" ]; then args+=(--force-prune); fi
          node generate.mjs "${args[@]}"
      - name: Upload this voice's clips
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ matrix.voice }}
          path: |
            clips/${{ matrix.voice }}
            clips/settings.json
          retention-days: 3
      - name: Fail the run if any clip failed (finished clips are still kept)
        if: ${{ !cancelled() && steps.gen.outcome == 'failure' }}
        run: |
          echo "generate.mjs reported failures or hit the time limit. See the generate step log. Finished clips were still uploaded and committed."
          exit 1

  commit:
    needs: [plan, generate]
    # `!cancelled()` so finished voices are kept when another voice failed, but a run you cancel never pushes.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Download clips
        uses: actions/download-artifact@v4
        with:
          pattern: clips-*
          merge-multiple: true
          path: ${{ runner.temp }}/clips-new
      - name: Stop if clips changed on main while this run was generating
        run: |
          git fetch --quiet origin main
          if [ -n "$(git diff --name-only "$GITHUB_SHA" origin/main -- clips)" ]; then
            echo "clips/ changed on main after this run started, so these artifacts are stale."
            echo "Nothing was pushed. Run 'Generate voice clips' again from main."
            exit 1
          fi
      - name: Build and validate the new clips folder
        env:
          NEW: ${{ runner.temp }}/clips-new
          STAGING: ${{ runner.temp }}/staging
          FORCE: ${{ inputs.force_prune }}
        run: |
          python3 -I - <<'PY'
          import json, os, re, shutil, stat, sys
          new, staging = os.environ["NEW"], os.environ["STAGING"]
          force = os.environ.get("FORCE") == "true"
          voices = set(re.findall(r"kokoro:'([a-z_]+)'", open("voice-service.js", encoding="utf8").read()))
          if not voices:
              sys.exit("could not read the voice list from voice-service.js")
          problems = []

          def lmode(path):
              return os.lstat(path).st_mode  # lstat: never follow links

          # Start from the clips already on main, then replace only the voices that were just recorded.
          shutil.copytree("clips", staging, symlinks=True)
          if os.path.isdir(new) and stat.S_ISDIR(lmode(new)):
              for entry in sorted(os.listdir(new)):
                  src = os.path.join(new, entry)
                  dst = os.path.join(staging, entry)
                  if entry == "settings.json" and stat.S_ISREG(lmode(src)):
                      shutil.copyfile(src, dst)
                  elif entry in voices and stat.S_ISDIR(lmode(src)):
                      shutil.rmtree(dst, ignore_errors=True)
                      shutil.copytree(src, dst, symlinks=True)
                  else:
                      problems.append(f"unexpected entry {entry} in the artifacts")
          if problems:
              print("\n".join(problems[:50]))
              sys.exit(1)

          # Only plain files and plain folders; no links, devices or hard links anywhere.
          for dirpath, dirnames, filenames in os.walk(staging, followlinks=False):
              for name in dirnames + filenames:
                  p = os.path.join(dirpath, name)
                  st = os.lstat(p)
                  if stat.S_ISLNK(st.st_mode) or not (stat.S_ISREG(st.st_mode) or stat.S_ISDIR(st.st_mode)):
                      problems.append(f"{os.path.relpath(p, staging)} is not a plain file or folder")
                  elif stat.S_ISREG(st.st_mode) and st.st_nlink > 1:
                      problems.append(f"{os.path.relpath(p, staging)} is a hard link")
          if problems:
              print("\n".join(problems[:50]))
              sys.exit(1)

          total_bytes = 0
          for entry in sorted(os.listdir(staging)):
              path = os.path.join(staging, entry)
              if entry == "settings.json" and stat.S_ISREG(lmode(path)):
                  data = json.load(open(path))
                  keys = {"encoder", "digest", "kokoroJs", "modelRevision"}
                  if os.path.getsize(path) > 2000 or set(data) != keys or not all(isinstance(v, str) for v in data.values()):
                      problems.append("settings.json is not the expected four string fields")
              elif stat.S_ISDIR(lmode(path)) and entry in voices:
                  mp3s = 0
                  for name in os.listdir(path):
                      fp = os.path.join(path, name)
                      size = os.path.getsize(fp)
                      total_bytes += size
                      if name == "manifest.json":
                          data = json.load(open(fp))
                          if size > 1000000 or not isinstance(data, dict) or not all(isinstance(k, str) and isinstance(v, str) for k, v in data.items()):
                              problems.append(f"{entry}/manifest.json is not a flat string map under 1 MB")
                      elif re.fullmatch(r"[a-z0-9_-]+\.mp3", name):
                          mp3s += 1
                          head = open(fp, "rb").read(3)
                          if not (head == b"ID3" or (head[0] == 0xFF and head[1] & 0xE0 == 0xE0)):
                              problems.append(f"{entry}/{name} is not an MP3")
                          if not 1200 <= size <= 300000:
                              problems.append(f"{entry}/{name} has an odd size ({size} bytes)")
                      else:
                          problems.append(f"unexpected file {entry}/{name}")
                  old = os.path.join("clips", entry)
                  before = len([n for n in os.listdir(old) if n.endswith(".mp3")]) if os.path.isdir(old) else 0
                  if not force and mp3s < before * 0.95:
                      problems.append(f"{entry}: {mp3s} clips would replace {before} (more than 5% fewer); re-run with force_prune if this is intended")
              else:
                  problems.append(f"unexpected entry {entry}")
          for voice in sorted(voices):
              old = os.path.join("clips", voice)
              had = len([n for n in os.listdir(old) if n.endswith(".mp3")]) if os.path.isdir(old) else 0
              if had and not force and not os.path.isdir(os.path.join(staging, voice)):
                  problems.append(f"{voice}: no folder for this voice, which would delete its {had} clips")
          if total_bytes > 250 * 1024 * 1024:
              problems.append("the clips folder would be larger than 250 MB")
          if problems:
              print("\n".join(problems[:50]))
              sys.exit(1)
          print("clips validated")
          PY
      - name: Commit and push to main
        env:
          STAGING: ${{ runner.temp }}/staging
        run: |
          rm -rf clips
          cp -r --no-dereference "$STAGING" clips
          if [ -n "$(find clips ! -type f ! -type d -print -quit)" ]; then echo "non-regular file in clips/"; exit 1; fi
          git add -A clips
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update pre-recorded voice clips"
          git pull --rebase origin main
          # After the rebase the only thing we add on top of main must be under clips/.
          if git diff --name-only origin/main..HEAD | grep -qv '^clips/'; then echo "commit touches files outside clips/"; exit 1; fi
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_ENV"
      - name: Start the deploy and the repository scan
        if: ${{ env.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pushes made with GITHUB_TOKEN do not start other workflows, so start them directly.
          for wf in pages.yml denylist-guard.yml; do
            ok=0
            for attempt in 1 2 3; do
              if gh workflow run "$wf" --ref main; then ok=1; break; fi
              sleep 15
            done
            if [ "$ok" -ne 1 ]; then echo "Could not start $wf"; exit 1; fi
          done
