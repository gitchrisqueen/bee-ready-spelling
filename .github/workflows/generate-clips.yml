name: Generate voice clips

# Keeps the pre-recorded clips (every word, its practice sentence, and the voice sample) in sync with
# words.json and sentences.js. Only new or changed clips are generated (tools/clips/generate.mjs), so a
# normal run takes minutes. Each voice is recorded in its own parallel job. When clips change they are
# committed to main and the site is redeployed.
#
# Privilege split on purpose. `generate` legs run npm and third-party code with a READ-ONLY token and no
# stored credentials. `commit` holds the contents-write token, runs no npm or node code, and only accepts
# a strictly validated set of files from the artifacts. `start-deploy` is a separate small job that only
# holds actions-write, so a failed dispatch can be re-run on its own ("Re-run failed jobs") without
# redoing the commit.
#
# Manual run options (Actions tab > Generate voice clips > Run workflow):
#   voice        only this Kokoro voice id, e.g. af_heart
#   limit        stop after this many new clips per voice (smoke test, or split a big job)
#   redo         comma-separated clip keys to record again, e.g. blase,sentence_1abc
#   force_prune  allow deleting more than 5% of a voice's clips

on:
  push:
    branches: [main]
    paths:
      - words.json
      - sentences.js
      - voice-service.js
      - tools/clips/**
  workflow_dispatch:
    inputs:
      voice:
        description: Only this voice id (blank = all voices)
        required: false
        default: ''
      limit:
        description: Max new clips per voice this run (blank = no limit)
        required: false
        default: ''
      redo:
        description: Clip keys to record again, comma-separated (blank = none)
        required: false
        default: ''
      force_prune:
        description: Allow deleting more than 5% of a voice's clips
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: generate-clips
  cancel-in-progress: false

jobs:
  plan:
    # A manual run from any other branch must never reach main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      voices: ${{ steps.voices.outputs.voices }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # Always work from the newest main, not the commit that happened to trigger this run. A run that
      # was queued behind another one would otherwise start without that run's clip commit.
      - name: Check out the newest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Pin this run to that commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: List the voices from voice-service.js
        id: voices
        env:
          IN_VOICE: ${{ inputs.voice }}
        run: |
          python3 -I - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          voices = sorted(set(re.findall(r"kokoro:'([a-z_]+)'", open("voice-service.js", encoding="utf8").read())))
          only = os.environ.get("IN_VOICE", "")
          if only:
              voices = [v for v in voices if v == only]
          if not voices:
              raise SystemExit("no matching voice")
          print("voices=" + json.dumps(voices))
          PY

  generate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        voice: ${{ fromJSON(needs.plan.outputs.voices) }}
    steps:
      - name: Check out the pinned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Read-only job that only runs on main, so the cache is saved from main only.
          cache: npm
          cache-dependency-path: tools/clips/package-lock.json
      - name: Check words.json and the code before recording anything
        run: npm test
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install generator (no install scripts)
        working-directory: tools/clips
        run: npm ci --ignore-scripts
      - name: Generate missing or changed clips
        id: gen
        working-directory: tools/clips
        # Stop well before the job limit so the steps below can still save finished clips.
        timeout-minutes: 300
        continue-on-error: true
        env:
          VOICE: ${{ matrix.voice }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_REDO: ${{ inputs.redo }}
          IN_FORCE: ${{ inputs.force_prune }}
        run: |
          [[ "$VOICE" =~ ^[a-z_]+$ ]] || { echo "bad voice id"; exit 1; }
          args=(--prune --max-minutes 280 --voice "$VOICE")
          if [ -n "$IN_LIMIT" ]; then
            [[ "$IN_LIMIT" =~ ^[0-9]+$ ]] || { echo "limit must be a whole number"; exit 1; }
            args+=(--limit "$IN_LIMIT")
          fi
          if [ -n "$IN_REDO" ]; then
            [[ "$IN_REDO" =~ ^[a-z0-9_][a-z0-9_-]*(,[a-z0-9_][a-z0-9_-]*)*$ ]] || { echo "redo must be comma-separated clip keys"; exit 1; }
            args+=(--redo "$IN_REDO")
          fi
          if [ "$IN_FORCE" = "true" ]; then args+=(--force-prune); fi
          node generate.mjs "${args[@]}"
      - name: Upload this voice's clips
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ matrix.voice }}
          path: |
            clips/${{ matrix.voice }}
            clips/settings.json
          retention-days: 3
          overwrite: true
      - name: Fail the run if any clip failed (finished clips are still kept)
        if: ${{ !cancelled() && steps.gen.outcome == 'failure' }}
        run: |
          echo "generate.mjs reported failures or hit the time limit. See the generate step log. Finished clips were still uploaded and committed."
          exit 1

  commit:
    needs: [plan, generate]
    # `!cancelled()` so finished voices are kept when another voice failed, but a run you cancel never pushes.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - name: Check out the pinned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Download clips (one folder per voice's artifact)
        uses: actions/download-artifact@v4
        with:
          pattern: clips-*
          path: ${{ runner.temp }}/clips-new
      - name: Stop if clips changed on main while this run was generating
        env:
          PINNED: ${{ needs.plan.outputs.sha }}
        run: |
          git fetch --quiet origin main
          if [ -n "$(git diff --name-only "$PINNED" origin/main -- clips)" ]; then
            echo "clips/ changed on main after this run started, so these artifacts are stale."
            echo "Nothing was pushed. Run 'Generate voice clips' again from main."
            exit 1
          fi
      - name: Build and validate the new clips folder (voice by voice)
        env:
          NEW: ${{ runner.temp }}/clips-new
          STAGING: ${{ runner.temp }}/staging
          SKIPPED: ${{ runner.temp }}/skipped.txt
          FORCE: ${{ inputs.force_prune }}
        run: |
          python3 -I - <<'PY'
          import json, os, re, shutil, stat, sys
          new, staging, skipped_file = os.environ["NEW"], os.environ["STAGING"], os.environ["SKIPPED"]
          force = os.environ.get("FORCE") == "true"
          voices = set(re.findall(r"kokoro:'([a-z_]+)'", open("voice-service.js", encoding="utf8").read()))
          if not voices:
              sys.exit("could not read the voice list from voice-service.js")
          MAX_FILES_PER_VOICE = 6000
          fatal, skipped, ok_voices, settings_candidates = [], {}, [], []

          def lmode(path):
              return os.lstat(path).st_mode  # lstat: never follow links

          def mp3_count(path):
              return len([n for n in os.listdir(path) if n.endswith(".mp3")]) if os.path.isdir(path) else 0

          def check_voice(voice, root):
              """Return a list of problems for one voice folder. Never follows links."""
              problems = []
              total = 0
              for name in os.listdir(root):
                  fp = os.path.join(root, name)
                  st = os.lstat(fp)
                  if not stat.S_ISREG(st.st_mode) or st.st_nlink > 1:
                      problems.append(f"{voice}/{name} is not a plain file")
                      continue
                  total += 1
                  size = st.st_size
                  if name == "manifest.json":
                      # Check the size first, then parse exactly the bytes that were read.
                      if os.path.getsize(fp) >= 1000000:
                          problems.append(f"{voice}/manifest.json is 1 MB or larger")
                          continue
                      try:
                          with open(fp, "rb") as fh:
                              raw_manifest = fh.read(1000001)
                          if len(raw_manifest) >= 1000000:
                              raise ValueError("too large")
                          data = json.loads(raw_manifest)
                      except Exception as err:
                          problems.append(f"{voice}/manifest.json is not valid JSON ({err.__class__.__name__})")
                          continue
                      if not isinstance(data, dict) or not all(isinstance(k, str) and isinstance(v, str) for k, v in data.items()):
                          problems.append(f"{voice}/manifest.json is not a flat string map")
                  elif re.fullmatch(r"[a-z0-9_-]+\.mp3", name):
                      head = open(fp, "rb").read(3)
                      if len(head) < 3 or not (head == b"ID3" or (head[0] == 0xFF and head[1] & 0xE0 == 0xE0)):
                          problems.append(f"{voice}/{name} is not an MP3")
                      if not 1200 <= size <= 300000:
                          problems.append(f"{voice}/{name} has an odd size ({size} bytes)")
                  else:
                      problems.append(f"unexpected file {voice}/{name}")
              if total > MAX_FILES_PER_VOICE:
                  problems.append(f"{voice} has {total} files (limit {MAX_FILES_PER_VOICE})")
              before = mp3_count(os.path.join("clips", voice))
              if not force and mp3_count(root) < before * 0.95:
                  problems.append(f"{voice}: {mp3_count(root)} clips would replace {before} (more than 5% fewer); re-run with force_prune if this is intended")
              return problems

          # Start from the clips already on main; only voices that pass their own checks replace main's copy.
          shutil.copytree("clips", staging, symlinks=True)
          if os.path.isdir(new) and stat.S_ISDIR(lmode(new)):
              for art in sorted(os.listdir(new)):
                  artdir = os.path.join(new, art)
                  m = re.fullmatch(r"clips-([a-z_]+)", art)
                  if not m or m.group(1) not in voices or not stat.S_ISDIR(lmode(artdir)):
                      fatal.append(f"unexpected artifact {art}")
                      continue
                  voice = m.group(1)
                  voice_src = None
                  for entry in os.listdir(artdir):
                      src = os.path.join(artdir, entry)
                      if entry == "settings.json" and stat.S_ISREG(lmode(src)):
                          settings_candidates.append((voice, src))
                      elif entry == voice and stat.S_ISDIR(lmode(src)):
                          voice_src = src
                      else:
                          # includes another voice's folder: an artifact may only supply its own voice
                          fatal.append(f"{art}: unexpected entry {entry}")
                  if voice_src is None:
                      continue
                  problems = check_voice(voice, voice_src)
                  if problems:
                      skipped[voice] = problems
                  else:
                      dst = os.path.join(staging, voice)
                      shutil.rmtree(dst, ignore_errors=True)
                      shutil.copytree(voice_src, dst, symlinks=False)
                      ok_voices.append(voice)
          if fatal:
              print("\n".join(fatal[:50]))
              sys.exit(1)

          # settings.json: take a changed one from a voice that passed; it must be exactly four short strings.
          # Validate and copy the same bytes: read at most 5000, reject over 4000, parse those bytes, write those bytes.
          main_settings = open(os.path.join("clips", "settings.json"), "rb").read() if os.path.exists(os.path.join("clips", "settings.json")) else b""
          for voice, src in settings_candidates:
              if voice not in ok_voices:
                  continue
              with open(src, "rb") as fh:
                  raw = fh.read(5000)
              if len(raw) > 4000:
                  skipped.setdefault("settings.json", []).append("settings.json is larger than 4000 bytes")
                  continue
              if raw == main_settings:
                  continue
              try:
                  data = json.loads(raw)
              except Exception:
                  skipped.setdefault("settings.json", []).append("settings.json is not valid JSON")
                  continue
              if set(data) != {"encoder", "digest", "kokoroJs", "modelRevision"} or not all(isinstance(v, str) for v in data.values()):
                  skipped.setdefault("settings.json", []).append("settings.json is not the expected four string fields")
                  continue
              dst = os.path.join(staging, "settings.json")
              if os.path.lexists(dst):
                  os.unlink(dst)
              with open(dst, "wb") as fh:
                  fh.write(raw)

          # Final safety pass over everything that will be committed.
          problems = []
          total_bytes = 0
          for dirpath, dirnames, filenames in os.walk(staging, followlinks=False):
              for name in dirnames + filenames:
                  p = os.path.join(dirpath, name)
                  st = os.lstat(p)
                  if stat.S_ISLNK(st.st_mode) or not (stat.S_ISREG(st.st_mode) or stat.S_ISDIR(st.st_mode)):
                      problems.append(f"{os.path.relpath(p, staging)} is not a plain file or folder")
                  elif stat.S_ISREG(st.st_mode):
                      total_bytes += st.st_size
          for entry in os.listdir(staging):
              if entry != "settings.json" and entry not in voices:
                  problems.append(f"unexpected entry {entry}")
          if total_bytes > 250 * 1024 * 1024:
              problems.append("the clips folder would be larger than 250 MB")
          if problems:
              print("\n".join(problems[:50]))
              sys.exit(1)

          with open(skipped_file, "w") as fh:
              for voice, issues in skipped.items():
                  fh.write(f"{voice} was NOT updated:\n  " + "\n  ".join(issues[:10]) + "\n")
          for voice, issues in skipped.items():
              print(f"::warning::{voice} was not updated: {issues[0]}")
          print(f"clips validated; updated voices: {sorted(ok_voices) or 'none'}; skipped: {sorted(skipped) or 'none'}")
          PY
      - name: Commit and push to main
        id: push
        env:
          STAGING: ${{ runner.temp }}/staging
        run: |
          rm -rf clips
          cp -r --no-dereference "$STAGING" clips
          if [ -n "$(find clips ! -type f ! -type d -print -quit)" ]; then echo "non-regular file in clips/"; exit 1; fi
          git add -A clips
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update pre-recorded voice clips [skip ci]"
          git pull --rebase origin main
          # After the rebase the only thing we add on top of main must be under clips/.
          if git diff --name-only origin/main..HEAD | grep -qv '^clips/'; then echo "commit touches files outside clips/"; exit 1; fi
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Fail the run if a voice was rejected (the other voices were still committed)
        if: ${{ always() }}
        env:
          SKIPPED: ${{ runner.temp }}/skipped.txt
        run: |
          if [ -s "$SKIPPED" ]; then cat "$SKIPPED"; exit 1; fi

  # Pushes made with GITHUB_TOKEN do not start other workflows, so start the deploy and the repository
  # scan directly. This is its own job so that a failed dispatch can be re-run alone: the clips are
  # already on main, and re-running `commit` would stop at its stale check.
  start-deploy:
    needs: commit
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.commit.outputs.pushed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the deploy and the repository scan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for wf in pages.yml denylist-guard.yml; do
            ok=0
            for attempt in 1 2 3; do
              if gh workflow run "$wf" --ref main; then ok=1; break; fi
              sleep 15
            done
            if [ "$ok" -ne 1 ]; then echo "Could not start $wf"; exit 1; fi
          done
